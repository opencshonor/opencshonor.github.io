<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCSHonor | Terminal Access</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #050507;       
      --primary: #3b82f6;        
      --accent: #10b981;         
      --text-main: #ffffff;      
      --text-sub: #71717a;       
      --terminal-prompt: #f87171; 
      --border: rgba(59, 130, 246, 0.2);
      --font-code: "JetBrains Mono", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: "Noto Sans SC", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* 终端背景网格 + 扫描线特效 */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 35px 35px;
      mask-image: radial-gradient(circle at center, black 30%, transparent 90%);
      z-index: -1;
    }

    /* 赛博扫描线 */
    body::after {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(to bottom, transparent, rgba(59, 130, 246, 0.1), transparent);
      animation: scanline 8s linear infinite;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes scanline {
      0% { transform: translateY(-100vh); }
      100% { transform: translateY(100vh); }
    }

    .container {
      width: 100%;
      max-width: 1100px;
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      transition: filter 0.2s;
    }

    /* 按键冲击波特效类 */
    .glitch-hit {
      filter: brightness(1.5) contrast(1.2) hue-rotate(10deg);
    }

    /* === 主 Logo 区域 === */
    .hero-logo-wrapper {
      position: relative;
      margin-bottom: 5px;
      animation: float 6s ease-in-out infinite;
    }

    .hero-img {
      width: 480px; 
      filter: drop-shadow(0 0 35px rgba(59, 130, 246, 0.3));
      transition: transform 0.3s;
    }
    .hero-img:hover { transform: scale(1.02); }

    .hero-ring {
      position: absolute;
      top: 50%; left: 50%;
      width: 580px; height: 580px;
      border: 1px dashed var(--primary);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.12;
      animation: spin 60s linear infinite;
    }

    .project-tag {
      font-family: var(--font-code);
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      padding: 4px 15px;
      color: var(--primary);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 1.2rem;
      text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }

    /* === Linux Root 终端 === */
    .terminal-window {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--border);
      padding: 10px 25px;
      border-radius: 4px;
      font-family: var(--font-code);
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.05);
    }

    .prompt-user { color: var(--terminal-prompt); font-weight: bold; }
    .prompt-path { color: var(--primary); }
    .prompt-char { color: var(--text-main); }

    .typing-text { color: var(--accent); font-weight: bold; text-shadow: 0 0 8px rgba(16, 185, 129, 0.3); }
    
    .cursor {
      display: inline-block;
      width: 10px; height: 1.2em;
      background-color: var(--accent);
      animation: blink 1s step-end infinite;
      vertical-align: middle;
      margin-left: 2px;
      box-shadow: 0 0 10px var(--accent);
    }

    /* === 统计卡片 === */
    .stats-container {
      display: flex;
      gap: 15px;
      margin-bottom: 1.8rem;
    }

    .stat-card {
      background: rgba(10, 10, 15, 0.8);
      border: 1px solid var(--border);
      padding: 15px 25px;
      min-width: 180px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    /* 卡片边角装饰 */
    .stat-card::after {
      content: ""; position: absolute; top: 0; right: 0;
      width: 15px; height: 15px; border-top: 2px solid var(--primary); border-right: 2px solid var(--primary);
    }

    .stat-card.visible { opacity: 1; transform: translateY(0); }
    .stat-card:hover { border-color: var(--primary); background: rgba(59, 130, 246, 0.05); }

    .stat-value { font-family: var(--font-code); font-size: 1.8rem; color: var(--text-main); }
    .stat-unit { font-size: 0.8rem; color: var(--primary); margin-left: 3px; font-weight: bold; }
    .stat-label { font-size: 0.7rem; color: var(--text-sub); margin-top: 3px; letter-spacing: 1px; }

    /* === Supported By (技术支持区) === */
    .support-section {
      width: 100%;
      margin-bottom: 1.8rem;
      text-align: center;
    }
    
    .support-header {
      font-family: var(--font-code);
      font-size: 0.65rem;
      color: var(--text-sub);
      margin-bottom: 12px;
      letter-spacing: 3px;
      opacity: 0.6;
    }

    .logo-grid {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
    }

    .logo-img {
      height: 24px;
      filter: grayscale(1) brightness(2) opacity(0.3);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .logo-img:hover {
      filter: grayscale(0) brightness(1) opacity(1);
      transform: scale(1.15) rotate(2deg);
    }

    /* === 登录按钮 === */
    .action-area { position: relative; }
    .enter-btn {
      background: rgba(59, 130, 246, 0.05);
      color: var(--text-main);
      border: 1px solid var(--primary);
      padding: 12px 50px;
      font-family: var(--font-code);
      font-size: 0.95rem;
      font-weight: bold;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .enter-btn:hover {
      background: var(--primary);
      color: #000;
      box-shadow: 0 0 35px rgba(59, 130, 246, 0.6);
      transform: translateY(-2px);
    }

    .enter-key { font-size: 0.7rem; border: 1px solid currentColor; padding: 1px 6px; border-radius: 3px; opacity: 0.8; }

    footer {
      position: absolute;
      bottom: 15px;
      text-align: center;
      font-family: var(--font-code);
      font-size: 0.6rem;
      color: var(--text-sub);
      letter-spacing: 1px;
    }

    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    @media (max-width: 768px) {
      .hero-img { width: 280px; }
      .hero-ring { width: 340px; height: 340px; }
      .stats-container { flex-direction: column; gap: 8px; }
      .terminal-window { font-size: 1rem; width: 90%; }
      .logo-grid { gap: 15px; flex-wrap: wrap; }
    }
  </style>
</head>

<body>
  <div class="container" id="main-container">
    
    <div class="hero-logo-wrapper">
      <div class="hero-ring"></div>
      <img src="assets/mylogo.png" alt="OpenCSHonor" class="hero-img">
    </div>

    <div class="project-tag">计试一站式学术资源共享项目</div>

    <div class="terminal-window">
      <div class="prompt">
        <span class="prompt-user">root</span>@<span>opencshonor</span>:<span class="prompt-path">~</span><span class="prompt-char">#</span>
      </div>
      <div class="input-area">
        <span style="color:var(--text-sub)">这里有</span>
        <span class="typing-text" id="typewriter"></span><span class="cursor"></span>
      </div>
    </div>

    <div class="stats-container" id="stats-section">
      <div class="stat-card">
        <div class="stat-value"><span class="counter" data-target="600">0</span><span class="stat-unit">+</span></div>
        <div class="stat-label">托管文件总数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value"><span class="prefix"></span><span class="counter" data-target="10">0</span><span class="stat-unit">GB</span></div>
        <div class="stat-label">托管文件大小</div>
      </div>
      <div class="stat-card">
        <div class="stat-value"><span class="prefix"></span><span class="counter" data-target="59">0</span><span class="stat-unit">%</span></div>
        <div class="stat-label">科目覆盖</div>
      </div>
    </div>

    <div class="support-section">
      <div class="support-header">--- HARDWARE ACCELERATED BY ---</div>
      <div class="logo-grid">
        <img src="assets/1.png" class="logo-img" onerror="this.style.display='none'">
        <img src="assets/2.png" class="logo-img" onerror="this.style.display='none'">
        <img src="assets/3.png" class="logo-img" onerror="this.style.display='none'">
        <img src="assets/4.png" class="logo-img" onerror="this.style.display='none'">
        <img src="assets/5.png" class="logo-img" onerror="this.style.display='none'">
        <img src="assets/6.png" class="logo-img" onerror="this.style.display='none'">
      </div>
    </div>

    <div class="action-area">
      <a href="https://opencshonor.vercel.app/site/index.html" class="enter-btn" id="enter-btn">
        立刻进入 <span class="enter-key">ENTER ↵</span>
      </a>
    </div>

    <footer>
      <div>&copy; OpenCSHonor Project. All Rights Reserved. Version 25.12-Beta</div>
      <div style="opacity:0.6; margin-top: 2px;">由计学组开发并长期维护</div>
    </footer>
  </div>

  <script>
    const PHRASES = ["课内资料", "科研学术", "研讨班课件", "出国交流", "升学深造", "竞赛经验", "杂项干货"];

    function countUp(el, target, hasPrefix) {
      let startTime = null;
      const duration = 2000;
      function animation(currentTime) {
        if (!startTime) startTime = currentTime;
        const progress = Math.min((currentTime - startTime) / duration, 1);
        const easeProgress = 1 - Math.pow(2, -10 * progress);
        const currentVal = Math.floor(easeProgress * target);
        el.innerText = currentVal;
        if (progress < 1) { requestAnimationFrame(animation); }
        else {
          el.innerText = target;
          if (hasPrefix) {
            const prefixSpan = el.parentElement.querySelector('.prefix');
            if (prefixSpan) prefixSpan.innerText = '> ';
          }
        }
      }
      requestAnimationFrame(animation);
    }

    function setupObserver() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            document.querySelectorAll('.stat-card').forEach((card, index) => {
              setTimeout(() => {
                card.classList.add('visible');
                const counter = card.querySelector('.counter');
                countUp(counter, +counter.getAttribute('data-target'), index > 0);
              }, index * 200);
            });
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
      observer.observe(document.getElementById('stats-section'));
    }

    class TerminalTypeWriter {
      constructor(el, phrases) {
        this.el = el; this.phrases = phrases;
        this.loop = 0; this.txt = ''; this.isDeleting = false;
        this.tick();
      }
      tick() {
        const i = this.loop % this.phrases.length;
        const full = this.phrases[i];
        this.txt = this.isDeleting ? full.substring(0, this.txt.length - 1) : full.substring(0, this.txt.length + 1);
        this.el.innerHTML = this.txt;
        let delta = 100 + Math.random() * 50;
        if (this.isDeleting) delta /= 2;
        if (!this.isDeleting && this.txt === full) { delta = 2000; this.isDeleting = true; }
        else if (this.isDeleting && this.txt === '') { this.isDeleting = false; this.loop++; delta = 500; }
        setTimeout(() => this.tick(), delta);
      }
    }

    // 交互特效逻辑
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const container = document.getElementById('main-container');
        const btn = document.getElementById('enter-btn');
        
        // 视觉冲击特效
        container.classList.add('glitch-hit');
        btn.style.background = 'var(--primary)';
        btn.style.color = '#000';
        
        setTimeout(() => {
          window.location.href = btn.href;
        }, 150);
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      setupObserver();
      new TerminalTypeWriter(document.getElementById('typewriter'), PHRASES);
    });
  </script>
</body>
</html>
