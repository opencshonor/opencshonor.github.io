<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCSHonor | Terminal Access</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #050507;
      --primary: #3b82f6;
      --accent: #10b981;
      --text-main: #ffffff;
      --text-sub: #71717a;
      --terminal-prompt: #f87171;
      --border: rgba(59, 130, 246, 0.2);
      --font-code: "JetBrains Mono", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: "Noto Sans SC", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* 终端背景网格 + 扫描线特效 */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 35px 35px;
      mask-image: radial-gradient(circle at center, black 30%, transparent 90%);
      z-index: -1;
    }

    /* 赛博扫描线 */
    body::after {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(to bottom, transparent, rgba(59, 130, 246, 0.1), transparent);
      animation: scanline 8s linear infinite;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes scanline {
      0% { transform: translateY(-100vh); }
      100% { transform: translateY(100vh); }
    }

    .container {
      width: 100%;
      max-width: 1400px;
      padding: 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      transition: filter 0.2s;
      transform: scale(1.15);
    }

    /* 按键冲击波特效类 */
    .glitch-hit {
      filter: brightness(1.5) contrast(1.2) hue-rotate(10deg);
    }

    /* === 主 Logo 区域 === */
    .hero-logo-wrapper {
      position: relative;
      margin-bottom: 15px;
      animation: float 6s ease-in-out infinite;
    }

    .hero-img {
      width: 580px;
      filter: drop-shadow(0 0 50px rgba(59, 130, 246, 0.5));
      transition: transform 0.3s, filter 0.3s;
    }
    .hero-img:hover {
      transform: scale(1.03);
      filter: drop-shadow(0 0 60px rgba(59, 130, 246, 0.7));
    }

    .hero-ring {
      position: absolute;
      top: 50%; left: 50%;
      width: 700px; height: 700px;
      border: 1px dashed var(--primary);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.15;
      animation: spin 60s linear infinite;
    }

    .project-tag {
      font-family: var(--font-code);
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      padding: 8px 24px;
      color: var(--primary);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 2rem;
      text-shadow: 0 0 12px rgba(59, 130, 246, 0.6);
      transition: all 0.3s;
    }

    .project-tag:hover {
      background: rgba(59, 130, 246, 0.2);
      transform: translateX(4px);
    }

    /* === Linux Root 终端 === */
    .terminal-window {
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--border);
      padding: 16px 36px;
      border-radius: 6px;
      font-family: var(--font-code);
      font-size: 1.4rem;
      margin-bottom: 2.5rem;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow:
        inset 0 0 20px rgba(59, 130, 246, 0.08),
        0 4px 20px rgba(0, 0, 0, 0.5);
      transition: all 0.3s;
    }

    .terminal-window:hover {
      border-color: var(--primary);
      box-shadow:
        inset 0 0 25px rgba(59, 130, 246, 0.12),
        0 6px 25px rgba(59, 130, 246, 0.3);
    }

    .prompt-user { color: var(--terminal-prompt); font-weight: bold; }
    .prompt-path { color: var(--primary); }
    .prompt-char { color: var(--text-main); }

    .typing-text {
      color: var(--accent);
      font-weight: bold;
      text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    .cursor {
      display: inline-block;
      width: 12px; height: 1.2em;
      background-color: var(--accent);
      animation: blink 1s step-end infinite;
      vertical-align: middle;
      margin-left: 2px;
      box-shadow: 0 0 12px var(--accent);
    }

    /* === Supported By (技术支持区 - 轮播) === */
    .support-section {
      width: 100%;
      margin-bottom: 2.5rem;
      text-align: center;
      overflow: hidden;
    }

    .support-header {
      font-family: var(--font-code);
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 24px;
      letter-spacing: 3px;
      opacity: 0.7;
    }

    .logo-carousel-wrapper {
      position: relative;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 左右渐变遮罩 */
    .logo-carousel-wrapper::before,
    .logo-carousel-wrapper::after {
      content: "";
      position: absolute;
      top: 0;
      width: 150px;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .logo-carousel-wrapper::before {
      left: 0;
      background: linear-gradient(to right, var(--bg-color), transparent);
    }

    .logo-carousel-wrapper::after {
      right: 0;
      background: linear-gradient(to left, var(--bg-color), transparent);
    }

    .logo-track {
      display: flex;
      align-items: center;
      gap: 80px;
      position: relative;
      animation: scroll-logos 20s linear infinite;
    }

    .logo-track:hover {
      animation-play-state: paused;
    }

    @keyframes scroll-logos {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(-100% / 2)); }
    }

    .logo-item {
      flex-shrink: 0;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .partner-logo {
      height: 40px;
      filter: grayscale(1) brightness(2) opacity(0.35);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 中间高亮效果 */
    .logo-item.center .partner-logo {
      filter: grayscale(0) brightness(1) opacity(1);
      transform: scale(1.3);
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
    }

    .logo-item:hover .partner-logo {
      filter: grayscale(0) brightness(1) opacity(1);
      transform: scale(1.25);
    }

    /* === 登录按钮 === */
    .action-area { position: relative; }
    .enter-btn {
      background: rgba(59, 130, 246, 0.08);
      color: var(--text-main);
      border: 1px solid var(--primary);
      padding: 18px 70px;
      font-family: var(--font-code);
      font-size: 1.15rem;
      font-weight: bold;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 18px;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      border-radius: 2px;
    }

    .enter-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.3), transparent);
      transition: left 0.5s;
    }

    .enter-btn:hover::before {
      left: 100%;
    }

    .enter-btn:hover {
      background: var(--primary);
      color: #000;
      box-shadow: 0 0 40px rgba(59, 130, 246, 0.7);
      transform: translateY(-3px);
    }

    .enter-key {
      font-size: 0.85rem;
      border: 1px solid currentColor;
      padding: 3px 10px;
      border-radius: 3px;
      opacity: 0.9;
    }

    footer {
      position: absolute;
      bottom: 20px;
      text-align: center;
      font-family: var(--font-code);
      font-size: 0.7rem;
      color: var(--text-sub);
      letter-spacing: 1px;
      opacity: 0.8;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes spin {
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @media (max-width: 768px) {
      .container {
        transform: scale(1);
        padding: 10px 20px;
      }
      .hero-img { width: 320px; }
      .hero-ring { width: 400px; height: 400px; }
      .terminal-window { font-size: 1rem; width: 90%; padding: 10px 20px; }
      .logo-track { gap: 50px; }
      .partner-logo { height: 28px; }
      .enter-btn { padding: 14px 45px; font-size: 0.95rem; }
    }
  </style>
</head>

<body>
  <div class="container" id="main-container">

    <div class="hero-logo-wrapper">
      <div class="hero-ring"></div>
      <img src="assets/mylogo.png" alt="OpenCSHonor" class="hero-img">
    </div>

    <div class="project-tag">计试一站式学术资源共享项目</div>

    <div class="terminal-window">
      <div class="prompt">
        <span class="prompt-user">root</span>@<span>opencshonor</span>:<span class="prompt-path">~</span><span class="prompt-char">#</span>
      </div>
      <div class="input-area">
        <span style="color:var(--text-sub)">这里有</span>
        <span class="typing-text" id="typewriter"></span><span class="cursor"></span>
      </div>
    </div>

    <div class="support-section">
      <div class="support-header">--- HARDWARE ACCELERATED BY ---</div>
      <div class="logo-carousel-wrapper">
        <div class="logo-track" id="logo-track">
          <!-- 第一组 -->
          <div class="logo-item"><img src="assets/1.png" class="partner-logo" alt="Partner 1" onerror="this.parentElement.style.display='none'"></div>
          <div class="logo-item"><img src="assets/2.png" class="partner-logo" alt="Partner 2" onerror="this.parentElement.style.display='none'"></div>
          <div class="logo-item"><img src="assets/3.png" class="partner-logo" alt="Partner 3" onerror="this.parentElement.style.display='none'"></div>
          <div class="logo-item"><img src="assets/4.png" class="partner-logo" alt="Partner 4" onerror="this.parentElement.style.display='none'"></div>
          <div class="logo-item"><img src="assets/5.png" class="partner-logo" alt="Partner 5" onerror="this.parentElement.style.display='none'"></div>
          <div class="logo-item"><img src="assets/6.png" class="partner-logo" alt="Partner 6" onerror="this.parentElement.style.display='none'"></div>
          <!-- 第二组（复制用于无缝循环） -->
          <div class="logo-item"><img src="assets/1.png" class="partner-logo" alt="Partner 1" onerror="this.parentElement.style.display='none'"></div>
          <div class="logo-item"><img src="assets/2.png" class="partner-logo" alt="Partner 2" onerror="this.parentElement.style.display='none'"></div>
          <div class="logo-item"><img src="assets/3.png" class="partner-logo" alt="Partner 3" onerror="this.parentElement.style.display='none'"></div>
          <div class="logo-item"><img src="assets/4.png" class="partner-logo" alt="Partner 4" onerror="this.parentElement.style.display='none'"></div>
          <div class="logo-item"><img src="assets/5.png" class="partner-logo" alt="Partner 5" onerror="this.parentElement.style.display='none'"></div>
          <div class="logo-item"><img src="assets/6.png" class="partner-logo" alt="Partner 6" onerror="this.parentElement.style.display='none'"></div>
        </div>
      </div>
    </div>

    <div class="action-area">
      <a href="https://weiyihong007.github.io/xjtu-cshonor/site/index.html" class="enter-btn" id="enter-btn">
        立刻进入 <span class="enter-key">ENTER ↵</span>
      </a>
    </div>

    <footer>
      <div>&copy; OpenCSHonor Project. All Rights Reserved. Version 26.07-Beta</div>
      <div style="opacity:0.6; margin-top: 2px;">由计学组开发并长期维护</div>
    </footer>
  </div>

  <script>
    const PHRASES = ["课内资料", "科研学术", "研讨班课件", "出国交流", "升学深造", "竞赛经验", "杂项干货"];

    class TerminalTypeWriter {
      constructor(el, phrases) {
        this.el = el; this.phrases = phrases;
        this.loop = 0; this.txt = ''; this.isDeleting = false;
        this.tick();
      }
      tick() {
        const i = this.loop % this.phrases.length;
        const full = this.phrases[i];
        this.txt = this.isDeleting ? full.substring(0, this.txt.length - 1) : full.substring(0, this.txt.length + 1);
        this.el.innerHTML = this.txt;
        let delta = 100 + Math.random() * 50;
        if (this.isDeleting) delta /= 2;
        if (!this.isDeleting && this.txt === full) { delta = 2000; this.isDeleting = true; }
        else if (this.isDeleting && this.txt === '') { this.isDeleting = false; this.loop++; delta = 500; }
        setTimeout(() => this.tick(), delta);
      }
    }

    // Logo 轮播中间高亮
    function updateCenterLogo() {
      const wrapper = document.querySelector('.logo-carousel-wrapper');
      const items = document.querySelectorAll('.logo-item');

      if (!wrapper || items.length === 0) return;

      const wrapperRect = wrapper.getBoundingClientRect();
      const centerX = wrapperRect.left + wrapperRect.width / 2;

      items.forEach(item => {
        const itemRect = item.getBoundingClientRect();
        const itemCenterX = itemRect.left + itemRect.width / 2;
        const distance = Math.abs(centerX - itemCenterX);

        if (distance < 100) {
          item.classList.add('center');
        } else {
          item.classList.remove('center');
        }
      });

      requestAnimationFrame(updateCenterLogo);
    }

    // 交互特效逻辑
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const container = document.getElementById('main-container');
        const btn = document.getElementById('enter-btn');

        // 视觉冲击特效
        container.classList.add('glitch-hit');
        btn.style.background = 'var(--primary)';
        btn.style.color = '#000';

        setTimeout(() => {
          window.location.href = btn.href;
        }, 150);
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      new TerminalTypeWriter(document.getElementById('typewriter'), PHRASES);
      updateCenterLogo();
    });
  </script>
</body>
</html>
